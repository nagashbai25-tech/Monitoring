<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Мини-блог</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    a { color: #185fa5; text-decoration: none; }
    a:hover { text-decoration: underline; }
    textarea, input[type=text] { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
    .post-preview { border-bottom: 1px solid #ddd; padding: 16px 0; }
    .comment { border-left: 3px solid #ddd; padding-left: 12px; margin: 12px 0; }
    .meta { color: #777; font-size: 13px; }
    button { padding: 8px 14px; cursor: pointer; }
    nav { margin-bottom: 24px; }
  </style>
</head>
<body>
  <nav><a href="{{ url_for('index') }}">Главная</a> · <a href="{{ url_for('new_post') }}">Новый пост</a></nav>
  {% block content %}{% endblock %}
</body>
</html>
