{% extends "base.html" %}
{% block content %}
  <h1>Мини-блог</h1>
  {% if not posts %}
    <p>Постов пока нет. <a href="{{ url_for('new_post') }}">Написать первый</a>.</p>
  {% endif %}
  {% for post in posts %}
    <div class="post-preview">
      <h3><a href="{{ url_for('view_post', post_id=post.id) }}">{{ post.title }}</a></h3>
      <div class="meta">{{ post.created_at.strftime('%d.%m.%Y %H:%M') }} · {{ post.comments|length }} коммент.</div>
    </div>
  {% endfor %}
{% endblock %}
