{% extends "base.html" %}
{% block content %}
  <h1>Редактировать пост</h1>
  <form method="post">
    <input type="text" name="title" value="{{ post.title }}" required>
    <textarea name="body" rows="6" required>{{ post.body }}</textarea>
    <button type="submit">Сохранить</button>
  </form>
{% endblock %}
